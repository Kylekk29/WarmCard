<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if card %}A card for {{ card.name }}{% else %}Card unavailable{% endif %} · WarmCard</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: var(--backdrop, #1e1b4b);
            font-family: system-ui, sans-serif;
            color: #24162f;
        }
        main { width: min(100%, 560px); text-align: center; }
        article {
            padding: clamp(24px, 7vw, 52px);
            border-radius: 24px;
            background: var(--card, #fff);
            box-shadow: 0 20px 56px #0004;
            overflow-wrap: anywhere;
        }
        .occasion { font-weight: 600; }
        h1 { margin: 12px 0 24px; font: 700 clamp(32px, 8vw, 54px)/1.1 Georgia, serif; }
        .message { white-space: pre-wrap; text-align: start; font: 1.125rem/1.65 Georgia, serif; }
        a { display: inline-block; margin-top: 20px; padding: 10px; color: #fff; }
    </style>
</head>
<body{% if card %} style="--backdrop: {{ theme.bg_gradient }}; --card: {{ theme.gradient }};"{% endif %}>
    <main>
        {% if card %}
        <article>
            <div class="occasion"><span aria-hidden="true">{{ theme.icon }}</span> {{ theme.label }}</div>
            <h1>For {{ card.name | default("Friend") }}</h1>
            <div class="message" dir="auto">{{ card.message }}</div>
        </article>
        {% else %}
        <article>
            <h1>Card unavailable</h1>
            <p>{% if unavailable %}Please try again in a moment.{% else %}Check the link or ask the sender to share it again.{% endif %}</p>
        </article>
        {% endif %}
        <a href="{{ url_for('studio') }}">Create a WarmCard</a>
    </main>
</body>
</html>
